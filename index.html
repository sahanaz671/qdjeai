<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SKYWATCH // MATRIX RADAR</title>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <style>
    :root {
      --bg: #000400;
      --panel: rgba(0, 18, 4, 0.82);
      --green: #00ff41;
      --green-dim: rgba(0, 255, 65, 0.25);
      --green-dark: #003b00;
      --amber: #ffb000;
      --cyan: #00f0ff;
      --font: "Courier New", Courier, monospace;
    }
    body.day-mode {
      --bg: #04131a;
      --panel: rgba(6, 28, 38, 0.85);
      --green: #38bdf8;
      --green-dim: rgba(56, 189, 248, 0.28);
      --green-dark: #0c4a6e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--green);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }
    #matrixCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.28;
      pointer-events: none;
    }
    .app {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 16px 14px 60px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--green-dim);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 10px var(--green);
    }
    .sub { font-size: 0.72rem; opacity: 0.8; margin-top: 2px; }
    .mode-btn {
      background: var(--panel);
      color: var(--green);
      border: 1px solid var(--green);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px var(--green-dim);
    }

    /* ATC Radar Scope */
    .radar-box {
      background: var(--panel);
      border: 1px solid var(--green);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 0 25px var(--green-dim), inset 0 0 20px var(--green-dim);
    }
    .radar-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 10px;
    }
    .scope-container {
      width: 220px;
      height: 220px;
      margin: 0 auto;
      position: relative;
      border-radius: 50%;
      border: 2px solid var(--green);
      background: radial-gradient(circle, var(--green-dim) 0%, #000000 75%);
      overflow: hidden;
      box-shadow: 0 0 20px var(--green-dim);
    }
    /* Rotating compass ring */
    .compass-ring {
      position: absolute;
      inset: 0;
      transition: transform 0.12s linear;
    }
    .compass-ring::before, .compass-ring::after {
      content: "";
      position: absolute;
      background: var(--green-dim);
    }
    .compass-ring::before { top: 0; bottom: 0; left: 50%; width: 1px; }
    .compass-ring::after { left: 0; right: 0; top: 50%; height: 1px; }
    .ring-mid {
      position: absolute;
      inset: 25%;
      border-radius: 50%;
      border: 1px dashed var(--green-dim);
    }
    .ring-inner {
      position: absolute;
      inset: 50%;
      border-radius: 50%;
      border: 1px dotted var(--green-dim);
    }
    .dir {
      position: absolute;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .d-n { top: 4px; left: 50%; transform: translateX(-50%); color: #ff3b30; text-shadow: 0 0 6px #ff3b30; }
    .d-s { bottom: 4px; left: 50%; transform: translateX(-50%); }
    .d-e { right: 6px; top: 50%; transform: translateY(-50%); }
    .d-w { left: 6px; top: 50%; transform: translateY(-50%); }

    /* Radar Sweep Beam */
    .sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0, 255, 65, 0.35) 0deg, transparent 65deg);
      animation: radarSpin 4s linear infinite;
      pointer-events: none;
    }
    @keyframes radarSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Human Observer in Center */
    .observer {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .fov-cone {
      position: absolute;
      bottom: 50%;
      width: 54px;
      height: 110px;
      background: linear-gradient(to top, rgba(0, 255, 65, 0.32), transparent);
      clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
    }
    .human-icon {
      width: 22px; height: 22px;
      background: #000;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      box-shadow: 0 0 10px var(--green);
    }

    .blip {
      position: absolute;
      width: 9px; height: 9px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px currentColor;
      z-index: 4;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .scan-btn {
      flex: 1;
      background: var(--green-dark);
      color: var(--green);
      border: 1px solid var(--green);
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      box-shadow: 0 0 14px var(--green-dim);
    }
    .scan-btn:active { transform: scale(0.98); }

    .status {
      text-align: center;
      font-size: 0.78rem;
      margin-bottom: 12px;
      opacity: 0.9;
    }

    /* Telemetry Cards */
    .card {
      background: var(--panel);
      border: 1px solid var(--green-dim);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      animation: glitchIn 0.25s ease;
    }
    @keyframes glitchIn {
      0% { opacity: 0; transform: translateX(-6px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .card.aligned {
      border-color: var(--green);
      box-shadow: 0 0 18px var(--green-dim);
      background: rgba(0, 45, 10, 0.88);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .route-banner {
      background: rgba(0, 255, 65, 0.1);
      border: 1px dashed var(--green-dim);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .title { font-size: 1.05rem; font-weight: bold; margin-bottom: 4px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.78rem;
      border-top: 1px solid var(--green-dim);
      padding-top: 8px;
    }
    .lbl { opacity: 0.65; font-size: 0.68rem; text-transform: uppercase; }
    .val { font-weight: bold; margin-top: 2px; }
    .align-footer {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dotted var(--green-dim);
      font-size: 0.78rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>

  <div class="app">
    <header>
      <div>
        <h1>[SKYWATCH_RADAR]</h1>
        <div class="sub" id="modeLabel">SYS.MODE // NIGHT OPTICS (ALL OBJECTS)</div>
      </div>
      <button class="mode-btn" id="modeToggle">☀️ DAY MODE</button>
    </header>

    <div class="radar-box">
      <div class="radar-header">
        <span>HDG: <strong id="hdgVal">000° N</strong></span>
        <span id="sensorTag">COMPASS: AUTO-LOCKING...</span>
      </div>

      <div class="scope-container">
        <div class="sweep"></div>
        <div class="observer">
          <div class="fov-cone"></div>
          <div class="human-icon">🧍</div>
        </div>
        <div class="compass-ring" id="compassRing">
          <div class="ring-mid"></div>
          <div class="ring-inner"></div>
          <span class="dir d-n">N</span>
          <span class="dir d-e">E</span>
          <span class="dir d-s">S</span>
          <span class="dir d-w">W</span>
          <div id="radarBlips"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="scan-btn" id="scanBtn">▶ INITIATE SKY SCAN</button>
      <button class="mode-btn" id="autoBtn">AUTO: OFF</button>
    </div>

    <div class="status" id="status">READY. STAND OUTDOORS & INITIATE SCAN.</div>
    <div id="results"></div>
  </div>

  <script>
    /* ================= 1. MATRIX CODE RAIN CANVAS ================= */
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");
    let cols, drops;
    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ";

    function initMatrix() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      cols = Math.floor(canvas.width / 16);
      drops = Array(cols).fill(1);
    }
    window.addEventListener("resize", initMatrix);
    initMatrix();

    let isDayMode = false;
    function drawMatrix() {
      ctx.fillStyle = isDayMode ? "rgba(4, 19, 26, 0.12)" : "rgba(0, 4, 0, 0.12)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = isDayMode ? "#38bdf8" : "#00ff41";
      ctx.font = "14px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * 16, drops[i] * 16);
        if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 45);

    /* ================= 2. DAY / NIGHT MODE SWITCH ================= */
    const modeToggle = document.getElementById("modeToggle");
    const modeLabel = document.getElementById("modeLabel");
    modeToggle.addEventListener("click", () => {
      isDayMode = !isDayMode;
      document.body.classList.toggle("day-mode", isDayMode);
      modeToggle.textContent = isDayMode ? "🌙 NIGHT MODE" : "☀️ DAY MODE";
      modeLabel.textContent = isDayMode
        ? "SYS.MODE // DAYLIGHT (AIRCRAFT ONLY)"
        : "SYS.MODE // NIGHT OPTICS (ALL OBJECTS)";
      runScan();
    });

    /* ================= 3. AUTOMATIC ANDROID COMPASS ================= */
    const compassRing = document.getElementById("compassRing");
    const hdgVal = document.getElementById("hdgVal");
    const sensorTag = document.getElementById("sensorTag");
    let currentHeading = 0;
    let absLocked = false;

    function toCompass(deg) {
      const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
    }

    function updateRadarHeading(deg, source) {
      currentHeading = Math.round(((deg % 360) + 360) % 360);
      hdgVal.textContent = `${String(currentHeading).padStart(3, "0")}° ${toCompass(currentHeading)}`;
      compassRing.style.transform = `rotate(${-currentHeading}deg)`;
      if (source) sensorTag.textContent = source;

      document.querySelectorAll(".card[data-az]").forEach(card => {
        const targetAz = Number(card.dataset.az);
        const diff = ((targetAz - currentHeading + 540) % 360) - 180;
        const alignEl = card.querySelector(".align-text");
        if (Math.abs(diff) <= 15) {
          card.classList.add("aligned");
          alignEl.textContent = "🎯 TARGET LOCKED — LOOK UP NOW!";
        } else {
          card.classList.remove("aligned");
          alignEl.textContent = diff > 0 ? `↪ TURN RIGHT ${Math.abs(diff)}°` : `↩ TURN LEFT ${Math.abs(diff)}°`;
        }
      });
    }

    function autoStartCompass() {
      // 1. Android Chrome True North (deviceorientationabsolute)
      window.addEventListener("deviceorientationabsolute", (e) => {
        if (e.alpha !== null) {
          absLocked = true;
          updateRadarHeading(360 - e.alpha, "COMPASS: MAGNETIC NORTH");
        }
      }, true);

      // 2. Fallback standard orientation (iOS webkitCompassHeading or Android relative)
      window.addEventListener("deviceorientation", (e) => {
        if (absLocked) return;
        if (typeof e.webkitCompassHeading === "number") {
          updateRadarHeading(e.webkitCompassHeading, "COMPASS: IOS NORTH");
        } else if (e.alpha !== null) {
          updateRadarHeading(360 - e.alpha, "COMPASS: GYRO ACTIVE");
        }
      }, true);
    }
    autoStartCompass();

    /* ================= 4. FLIGHT ROUTES, TIMES & SATELLITES ================= */
    const PROXY_URL = "https://skywatch-proxy.itzsahanaj-0671.workers.dev";
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const radarBlips = document.getElementById("radarBlips");
    const routeCache = {};

    function getBearingAndDist(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      const brng = ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
      return { dist, brng: Math.round(brng) };
    }

    async function lookupFlightRoute(callsign) {
      const clean = (callsign || "").trim().toUpperCase();
      if (!clean || clean === "UNKNOWN") return "LOCAL / UNLISTED";
      if (routeCache[clean]) return routeCache[clean];
      try {
        const res = await fetch(`https://hexdb.io/api/v1/route/icao/${clean}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.route) {
            routeCache[clean] = data.route.replace("-", " ➔ ");
            return routeCache[clean];
          }
        }
      } catch (e) {}
      routeCache[clean] = "EN ROUTE (LIVE ADS-B)";
      return routeCache[clean];
    }

    function formatTimeWindow(distKm, speedKmh, trackDeg, brngFromUser) {
      const now = new Date();
      const fmt = (d) => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (!speedKmh || speedKmh < 60) return `DETECTED ${fmt(now)}`;

      const bearingToUser = (brngFromUser + 180) % 360;
      const angleDiff = Math.abs(((trackDeg - bearingToUser + 540) % 360) - 180);
      const mins = Math.max(1, Math.round((distKm / speedKmh) * 60));

      if (distKm <= 10) return `OVERHEAD NOW (${fmt(now)})`;
      if (angleDiff <= 60) {
        const eta = new Date(now.getTime() + mins * 60000);
        return `APPROACH IN ~${mins}m (ETA ${fmt(eta)})`;
      }
      const passed = new Date(now.getTime() - mins * 60000);
      return `PASSED ~${mins}m AGO (${fmt(passed)})`;
    }

    async function fetchPlanes(lat, lon) {
      const radiusNm = 35; // ~65 km radar range
      const url = `${PROXY_URL}/?type=planes&lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&radius=${radiusNm}`;
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      const raw = (data.ac || []).filter(p => p.lat && p.lon && p.alt_baro !== "ground");

      const enriched = await Promise.all(raw.map(async p => {
        const { dist, brng } = getBearingAndDist(lat, lon, p.lat, p.lon);
        const callsign = (p.flight || p.r || "UNKNOWN").trim();
        const routeStr = await lookupFlightRoute(callsign);
        const altFt = typeof p.alt_baro === "number" ? p.alt_baro : 0;
        const speedKmh = Math.round((p.gs || 0) * 1.852);
        const timeStatus = formatTimeWindow(dist, speedKmh, p.track || 0, brng);
        const isCargo = ["FDX", "UPS", "CLX", "GTI", "DHL", "BOX", "ATN"].some(c => callsign.startsWith(c));

        return {
          type: isCargo ? "📦 CARGO AIRCRAFT" : "✈️ COMMERCIAL JET",
          color: isCargo ? "#ffb000" : "#00ff41",
          name: `${callsign}${p.t ? ` [${p.t}]` : ""}`,
          route: routeStr,
          timeStatus,
          az: brng,
          radarDistPct: Math.min(45, (dist / 65) * 45),
          look: `${toCompass(brng)} (${brng}°)`,
          distText: `${dist.toFixed(1)} KM`,
          headingText: `${toCompass(p.track || 0)} (${Math.round(p.track || 0)}°)`,
          speedAlt: `${speedKmh} KM/H • ${altFt.toLocaleString()} FT`,
          sortKey: dist
        };
      }));
      return enriched.sort((a, b) => a.sortKey - b.sortKey);
    }

    async function fetchSatellites(lat, lon) {
      if (isDayMode) return []; // Hidden in Daylight mode
      const res = await fetch(`${PROXY_URL}/?type=sats`);
      if (!res.ok) return [];
      const txt = await res.text();
      const lines = txt.replace(/\r/g, "").trim().split("\n").map(l => l.trim()).filter(Boolean);
      const now = new Date();
      const later = new Date(now.getTime() + 60000);
      const gmst = satellite.gstime(now);
      const gmstLater = satellite.gstime(later);
      const observerGd = { longitude: satellite.degreesToRadians(lon), latitude: satellite.degreesToRadians(lat), height: 0.1 };
      const sats = [];

      for (let i = 0; i < lines.length - 2; i += 3) {
        const satrec = satellite.twoline2satrec(lines[i+1], lines[i+2]);
        const posNow = satellite.propagate(satrec, now);
        const posNext = satellite.propagate(satrec, later);
        if (!posNow.position || !posNext.position) continue;

        const lookNow = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(posNow.position, gmst));
        const elevDeg = satellite.radiansToDegrees(lookNow.elevation);

        if (elevDeg > 10) {
          const azNow = Math.round(satellite.radiansToDegrees(lookNow.azimuth));
          const lookNext = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(posNext.position, gmstLater));
          const azNext = Math.round(satellite.radiansToDegrees(lookNext.azimuth));

          sats.push({
            type: "🛰️ ORBITAL SATELLITE",
            color: "#00f0ff",
            name: lines[i],
            route: `ORBIT PASS: ${toCompass(azNow)} ➔ ${toCompass(azNext)}`,
            timeStatus: `VISIBLE ARC (${Math.round(elevDeg)}° ELEV)`,
            az: azNow,
            radarDistPct: Math.max(8, ((90 - elevDeg) / 80) * 45),
            look: `${toCompass(azNow)} (${azNow}°)`,
            distText: `${Math.round(lookNow.rangeSat)} KM`,
            headingText: `AZ ${azNow}° ➔ ${azNext}°`,
            speedAlt: `27,500 KM/H • LEO ORBIT`,
            sortKey: 90 - elevDeg
          });
        }
      }
      return sats.sort((a, b) => a.sortKey - b.sortKey).slice(0, 12);
    }

    function runScan() {
      statusEl.textContent = "SCANNING AIRSPACE & ORBITAL TELEMETRY...";
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        const [planes, sats] = await Promise.all([fetchPlanes(lat, lon), fetchSatellites(lat, lon)]);
        const all = [...planes, ...sats];

        radarBlips.innerHTML = all.map(item => {
          const rad = (item.az - 90) * (Math.PI / 180);
          const x = 50 + Math.cos(rad) * item.radarDistPct;
          const y = 50 + Math.sin(rad) * item.radarDistPct;
          return `<div class="blip" style="left:${x}%;top:${y}%;background:${item.color};color:${item.color};"></div>`;
        }).join("");

        statusEl.textContent = `LOCKED: ${planes.length} AIRCRAFT // ${sats.length} SATELLITES`;

        resultsEl.innerHTML = all.length ? all.map(item => `
          <div class="card" data-az="${item.az}">
            <div class="card-top">
              <span>${item.type}</span>
              <span>${item.timeStatus}</span>
            </div>
            <div class="title">${item.name}</div>
            <div class="route-banner">
              <span>ROUTE: ${item.route}</span>
            </div>
            <div class="grid">
              <div>
                <div class="lbl">LOOK DIRECTION</div>
                <div class="val">${item.look}</div>
              </div>
              <div>
                <div class="lbl">RANGE</div>
                <div class="val">${item.distText}</div>
              </div>
              <div>
                <div class="lbl">HEADING</div>
                <div class="val">${item.headingText}</div>
              </div>
              <div>
                <div class="lbl">SPEED & ALTITUDE</div>
                <div class="val">${item.speedAlt}</div>
              </div>
            </div>
            <div class="align-footer">
              <span class="align-text">ROTATE PHONE TO ALIGN</span>
              <span>AZIMUTH: ${item.az}°</span>
            </div>
          </div>
        `).join("") : `<div class="card" style="text-align:center;">NO MOVING TARGETS IN LOCAL SECTOR RIGHT NOW.</div>`;

        updateRadarHeading(currentHeading);
      }, err => {
        statusEl.textContent = "GPS ERROR: " + err.message;
      }, { enableHighAccuracy: true });
    }

    document.getElementById("scanBtn").addEventListener("click", runScan);

    let autoTimer = null;
    const autoBtn = document.getElementById("autoBtn");
    autoBtn.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoBtn.textContent = "AUTO: OFF";
      } else {
        runScan();
        autoTimer = setInterval(runScan, 15000);
        autoBtn.textContent = "AUTO: 15S";
      }
    });
  </script>
</body>
</html>
