<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SkyWatch — Night Sky Radar</title>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <style>
    :root {
      --bg: #03050a;
      --card: rgba(15, 23, 42, 0.72);
      --border: rgba(56, 189, 248, 0.16);
      --accent: #38bdf8;
      --emerald: #34d399;
      --amber: #fbbf24;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #0b132b 0%, var(--bg) 65%);
      color: var(--text);
      margin: 0;
      padding: 18px 16px 40px;
      min-height: 100vh;
    }
    .container { max-width: 540px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.02em; background: linear-gradient(90deg, #e0f2fe, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
    .controls { display: flex; gap: 8px; margin-bottom: 14px; }
    button {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border: 1px solid rgba(125, 211, 252, 0.25);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }
    button:active { transform: scale(0.98); }
    button.secondary { background: rgba(30, 41, 59, 0.8); flex: 0 0 auto; font-size: 0.85rem; }
    .compass-bar {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .compass-dial {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      position: relative;
      display: flex; align-items: center; justify-content: center;
      background: rgba(2, 6, 23, 0.6);
    }
    .needle {
      width: 2px; height: 32px;
      background: linear-gradient(to bottom, #f43f5e 50%, #64748b 50%);
      border-radius: 2px;
      transition: transform 0.12s ease-out;
    }
    .status { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; text-align: center; }
    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { font-size: 0.72rem; padding: 3px 9px; border-radius: 99px; font-weight: 700; letter-spacing: 0.03em; }
    .plane { background: rgba(2, 132, 199, 0.22); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }
    .sat { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3); }
    .approach-tag { font-size: 0.75rem; font-weight: 600; color: var(--amber); }
    .title { font-weight: 700; font-size: 1.08rem; margin-bottom: 6px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(148, 163, 184, 0.12); }
    .metric-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .metric-val { font-size: 0.88rem; font-weight: 600; color: var(--text); margin-top: 1px; }
    .align-hint { margin-top: 8px; font-size: 0.8rem; color: #38bdf8; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🌌 SkyWatch Night</h1>
        <div class="sub">Visual Overhead Radar (~45 km radius)</div>
      </div>
    </header>

    <div class="compass-bar">
      <div>
        <div class="metric-label">Phone Heading</div>
        <div class="metric-val" id="headingText">Move phone to calibrate</div>
      </div>
      <div class="compass-dial">
        <div class="needle" id="needle"></div>
      </div>
    </div>

    <div class="controls">
      <button id="scanBtn">🔭 Scan My Sky</button>
      <button id="compassBtn" class="secondary">🧭 Compass</button>
    </div>

    <div id="status" class="status">Ready to scan your local sky.</div>
    <div id="results"></div>
  </div>

  <script>
    const PROXY_URL = "https://skywatch-proxy.itzsahanaj-0671.workers.dev";
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const headingText = document.getElementById("headingText");
    const needle = document.getElementById("needle");
    let phoneHeading = null;
    let currentItems = [];

    function toCompass(deg) {
      const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
    }

    function updateCompassUI(heading) {
      phoneHeading = Math.round(heading);
      headingText.textContent = `${toCompass(phoneHeading)} (${phoneHeading}°)`;
      needle.style.transform = `rotate(${-phoneHeading}deg)`;
      document.querySelectorAll("[data-az]").forEach(el => {
        const targetAz = Number(el.dataset.az);
        const diff = ((targetAz - phoneHeading + 540) % 360) - 180;
        if (Math.abs(diff) <= 12) {
          el.textContent = "🎯 Aligned! Look up now";
          el.style.color = "#34d399";
        } else {
          el.textContent = diff > 0 ? `↪ Turn right ${Math.abs(diff)}°` : `↩ Turn left ${Math.abs(diff)}°`;
          el.style.color = "#38bdf8";
        }
      });
    }

    function initCompass() {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(res => {
          if (res === "granted") window.addEventListener("deviceorientation", handleOrientation, true);
        }).catch(() => {});
      } else {
        window.addEventListener("deviceorientationabsolute", handleOrientation, true);
        window.addEventListener("deviceorientation", handleOrientation, true);
      }
    }

    function handleOrientation(e) {
      let heading = e.webkitCompassHeading ?? (e.alpha !== null ? (360 - e.alpha) % 360 : null);
      if (heading !== null) updateCompassUI(heading);
    }

    document.getElementById("compassBtn").addEventListener("click", initCompass);

    function getBearingAndDist(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      const brng = ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
      return { dist, brng: Math.round(brng) };
    }

    function analyzeApproach(brngFromUser, trackDeg, distKm, speedKmh) {
      if (trackDeg === undefined || trackDeg === null || speedKmh < 50) {
        return { label: "In area", route: "Heading unknown" };
      }
      const bearingToUser = (brngFromUser + 180) % 360;
      const angleDiff = Math.abs(((trackDeg - bearingToUser + 540) % 360) - 180);
      const fromDir = toCompass((trackDeg + 180) % 360);
      const toDir = toCompass(trackDeg);
      const route = `Moving ${fromDir} → ${toDir} (${Math.round(trackDeg)}°)`;

      if (distKm <= 8) return { label: "🔥 Directly Overhead", route };
      if (angleDiff <= 55) {
        const mins = Math.max(1, Math.round((distKm / speedKmh) * 60));
        return { label: `⏳ Approaching (~${mins} min)`, route };
      }
      if (angleDiff >= 125) return { label: "↗ Moving Away", route };
      return { label: "↔ Passing Nearby", route };
    }

    async function fetchPlanes(lat, lon) {
      const radiusNm = 25; // ~46 km visual approach window
      const url = `${PROXY_URL}/?type=planes&lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&radius=${radiusNm}`;
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      return (data.ac || [])
        .filter(p => p.lat && p.lon && p.alt_baro !== "ground")
        .map(p => {
          const { dist, brng } = getBearingAndDist(lat, lon, p.lat, p.lon);
          const altFt = typeof p.alt_baro === "number" ? p.alt_baro : 0;
          const speedKmh = Math.round((p.gs || 0) * 1.852);
          const { label, route } = analyzeApproach(brng, p.track, dist, speedKmh);
          const model = p.t ? ` • ${p.t}` : "";
          return {
            type: "plane",
            name: `${(p.flight || p.r || "Aircraft").trim()}${model}`,
            tag: label,
            az: brng,
            look: `${toCompass(brng)} (${brng}°)`,
            distText: `${dist.toFixed(1)} km away`,
            route,
            speedAlt: `${speedKmh} km/h • ${altFt.toLocaleString()} ft`,
            sortKey: dist
          };
        })
        .sort((a, b) => a.sortKey - b.sortKey);
    }

    async function fetchSatellites(lat, lon) {
      const res = await fetch(`${PROXY_URL}/?type=sats`);
      if (!res.ok) return [];
      const txt = await res.text();
      const lines = txt.replace(/\r/g, "").trim().split("\n").map(l => l.trim()).filter(Boolean);
      const now = new Date();
      const later = new Date(now.getTime() + 60000); // +1 min to find travel direction
      const gmst = satellite.gstime(now);
      const gmstLater = satellite.gstime(later);
      const observerGd = { longitude: satellite.degreesToRadians(lon), latitude: satellite.degreesToRadians(lat), height: 0.1 };
      const overhead = [];

      for (let i = 0; i < lines.length - 2; i += 3) {
        const satrec = satellite.twoline2satrec(lines[i+1], lines[i+2]);
        const posNow = satellite.propagate(satrec, now);
        const posNext = satellite.propagate(satrec, later);
        if (!posNow.position || !posNext.position) continue;

        const lookNow = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(posNow.position, gmst));
        const elevDeg = satellite.radiansToDegrees(lookNow.elevation);

        if (elevDeg > 25) {
          const azNow = Math.round(satellite.radiansToDegrees(lookNow.azimuth));
          const lookNext = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(posNext.position, gmstLater));
          const azNext = Math.round(satellite.radiansToDegrees(lookNext.azimuth));
          const elevNext = satellite.radiansToDegrees(lookNext.elevation);

          overhead.push({
            type: "sat",
            name: lines[i],
            tag: elevNext > elevDeg ? "⏳ Rising Higher" : "↘ Descending",
            az: azNow,
            look: `${toCompass(azNow)} (${azNow}°) • ${Math.round(elevDeg)}° high`,
            distText: `${Math.round(lookNow.rangeSat)} km slant range`,
            route: `Tracking ${toCompass(azNow)} → ${toCompass(azNext)}`,
            speedAlt: `~27,500 km/h • Low Earth Orbit`,
            sortKey: 90 - elevDeg
          });
        }
      }
      return overhead.sort((a, b) => a.sortKey - b.sortKey).slice(0, 8);
    }

    document.getElementById("scanBtn").addEventListener("click", () => {
      initCompass();
      statusEl.textContent = "Locking GPS & scanning overhead...";
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        const [planes, sats] = await Promise.all([fetchPlanes(lat, lon), fetchSatellites(lat, lon)]);
        const all = [...planes, ...sats];
        statusEl.textContent = `Visible sky: ${planes.length} aircraft • ${sats.length} high satellites`;
        resultsEl.innerHTML = all.length ? all.map(item => `
          <div class="card">
            <div class="card-top">
              <span class="badge ${item.type}">${item.type === "plane" ? "✈️ AIRCRAFT" : "🛰️ SATELLITE"}</span>
              <span class="approach-tag">${item.tag}</span>
            </div>
            <div class="title">${item.name}</div>
            <div class="grid">
              <div>
                <div class="metric-label">Look Direction</div>
                <div class="metric-val">${item.look}</div>
              </div>
              <div>
                <div class="metric-label">Distance</div>
                <div class="metric-val">${item.distText}</div>
              </div>
              <div>
                <div class="metric-label">Trajectory</div>
                <div class="metric-val">${item.route}</div>
              </div>
              <div>
                <div class="metric-label">Speed & Altitude</div>
                <div class="metric-val">${item.speedAlt}</div>
              </div>
            </div>
            <div class="align-hint" data-az="${item.az}">🧭 Tap Compass & turn phone to line up</div>
          </div>
        `).join("") : "<div class='card' style='text-align:center;color:#94a3b8;'>Clear sky right now—no aircraft within 45 km or satellites above 25°.</div>";
      }, err => {
        statusEl.textContent = "GPS error: " + err.message;
      }, { enableHighAccuracy: true });
    });
  </script>
</body>
</html>
