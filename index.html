<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SKYWATCH PRO // FULL VECTOR MATRIX</title>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <style>
    :root {
      --bg: #000301;
      --panel: rgba(2, 16, 6, 0.86);
      --green: #00ff41;
      --green-bright: #d4ffe0;
      --green-dim: rgba(0, 255, 65, 0.24);
      --green-dark: #00330c;
      --amber: #ffb000;
      --cyan: #00f0ff;
      --red: #ff3b30;
      --font: "Courier New", Courier, monospace;
    }
    body.day-mode {
      --bg: #03111a;
      --panel: rgba(5, 25, 38, 0.88);
      --green: #38bdf8;
      --green-bright: #e0f2fe;
      --green-dim: rgba(56, 189, 248, 0.26);
      --green-dark: #0c4a6e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--green);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.5s ease;
    }
    #spaceMatrixCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .app {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 12px 72px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--green-dim);
      padding-bottom: 10px;
      margin-bottom: 12px;
      gap: 6px;
    }
    h1 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 12px var(--green);
    }
    .sub { font-size: 0.65rem; opacity: 0.85; margin-top: 2px; }
    .hdr-btns { display: flex; gap: 6px; }
    .mode-btn {
      background: var(--panel);
      color: var(--green);
      border: 1px solid var(--green);
      padding: 6px 8px;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 0.68rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px var(--green-dim);
    }

    /* Tactical Radar Console */
    .radar-box {
      background: var(--panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--green);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85), 0 0 24px var(--green-dim), inset 0 0 20px var(--green-dim);
    }
    .radar-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--green-dim);
      padding-bottom: 6px;
    }
    .scope-container {
      width: 272px;
      height: 272px;
      margin: 6px auto;
      position: relative;
      border-radius: 50%;
      border: 2px solid var(--green);
      background: radial-gradient(circle, var(--green-dim) 0%, #000000 78%);
      overflow: hidden;
      box-shadow: 0 0 25px var(--green-dim), inset 0 0 20px rgba(0, 255, 65, 0.16);
    }
    .compass-ring {
      position: absolute;
      inset: 0;
      transition: transform 0.1s linear;
    }
    .compass-ring::before, .compass-ring::after {
      content: "";
      position: absolute;
      background: var(--green-dim);
    }
    .compass-ring::before { top: 0; bottom: 0; left: 50%; width: 1px; }
    .compass-ring::after { left: 0; right: 0; top: 50%; height: 1px; }

    .route-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .range-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed var(--green-dim);
      pointer-events: none;
    }
    .r-1 { inset: 33.3%; }
    .r-2 { inset: 16.6%; }
    .ring-label {
      position: absolute;
      font-size: 0.56rem;
      opacity: 0.7;
      left: 51%;
      transform: translateY(-100%);
      pointer-events: none;
    }
    .rl-1 { top: 33.3%; }
    .rl-2 { top: 16.6%; }
    .rl-3 { top: 5%; }

    .dir {
      position: absolute;
      font-size: 0.74rem;
      font-weight: bold;
      z-index: 3;
    }
    .d-n { top: 4px; left: 50%; transform: translateX(-50%); color: var(--red); text-shadow: 0 0 8px var(--red); }
    .d-s { bottom: 4px; left: 50%; transform: translateX(-50%); }
    .d-e { right: 6px; top: 50%; transform: translateY(-50%); }
    .d-w { left: 6px; top: 50%; transform: translateY(-50%); }

    .sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0, 255, 65, 0.34) 0deg, transparent 65deg);
      animation: radarSpin 4s linear infinite;
      pointer-events: none;
      z-index: 4;
    }
    @keyframes radarSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .observer {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .fov-cone {
      position: absolute;
      bottom: 50%;
      width: 64px;
      height: 136px;
      background: linear-gradient(to top, rgba(0, 255, 65, 0.3), transparent);
      clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
    }
    .human-icon {
      width: 24px; height: 24px;
      background: #000;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      box-shadow: 0 0 12px var(--green);
    }

    .radar-target {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 7;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px;
    }
    .target-tag {
      font-size: 0.55rem;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 1px 3px;
      border-radius: 3px;
      margin-top: 1px;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .radar-target.selected .target-tag {
      border-color: var(--red);
      color: #fff;
      background: rgba(255, 59, 48, 0.35);
    }
    .reticle {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 1.5px dashed var(--red);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: spinReticle 3s linear infinite;
      pointer-events: none;
    }
    @keyframes spinReticle { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

    .radar-legend {
      display: flex;
      justify-content: space-around;
      font-size: 0.62rem;
      opacity: 0.85;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--green-dim);
    }
    .lock-hud {
      margin-top: 10px;
      background: rgba(255, 59, 48, 0.12);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 9px 10px;
      display: none;
    }
    .lock-hud.active { display: block; }
    .lock-hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-weight: bold;
      color: #ff6b6b;
      margin-bottom: 4px;
    }
    .unlock-btn {
      background: transparent;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      font-family: var(--font);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .lock-hud-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      font-size: 0.72rem;
      color: var(--green-bright);
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .scan-btn {
      flex: 1;
      background: var(--green-dark);
      color: var(--green-bright);
      border: 1px solid var(--green);
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 0 16px var(--green-dim);
    }
    .scan-btn:active { transform: scale(0.98); }

    .status {
      text-align: center;
      font-size: 0.73rem;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .card {
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--green-dim);
      border-left: 4px solid var(--green);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.75);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card.locked-card {
      border-color: var(--red);
      border-left-width: 5px;
      box-shadow: 0 0 22px rgba(255, 59, 48, 0.28);
    }
    .card.aligned {
      border-color: var(--green-bright);
      background: rgba(0, 52, 14, 0.92);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      margin-bottom: 6px;
      font-weight: bold;
      gap: 6px;
    }
    .lock-action-btn {
      background: var(--green-dark);
      color: var(--green-bright);
      border: 1px solid var(--green);
      border-radius: 5px;
      padding: 4px 8px;
      font-family: var(--font);
      font-size: 0.68rem;
      font-weight: bold;
      cursor: pointer;
    }
    .lock-action-btn.is-locked {
      background: rgba(255, 59, 48, 0.25);
      border-color: var(--red);
      color: #ff8a80;
    }
    .route-banner {
      background: rgba(0, 255, 65, 0.09);
      border: 1px dashed var(--green-dim);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .title { font-size: 1.02rem; font-weight: bold; margin-bottom: 6px; color: var(--green-bright); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.74rem;
      border-top: 1px solid var(--green-dim);
      padding-top: 8px;
    }
    .lbl { opacity: 0.65; font-size: 0.62rem; text-transform: uppercase; }
    .val { font-weight: bold; margin-top: 2px; }
    .align-footer {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dotted var(--green-dim);
      font-size: 0.74rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <canvas id="spaceMatrixCanvas"></canvas>

  <div class="app">
    <header>
      <div>
        <h1>[SKYWATCH_PRO // MATRIX]</h1>
        <div class="sub" id="modeLabel">140 KM FULL-VECTOR RADAR • NIGHT</div>
      </div>
      <div class="hdr-btns">
        <button class="mode-btn" id="soundToggle">🔊 AUDIO: MAX</button>
        <button class="mode-btn" id="modeToggle">☀️ DAY</button>
      </div>
    </header>

    <div class="radar-box">
      <div class="radar-header">
        <span>HDG: <strong id="hdgVal">000° N</strong></span>
        <span>RANGE: <strong>140 KM</strong></span>
        <span id="sensorTag">COMPASS: STANDBY</span>
      </div>

      <div class="scope-container">
        <div class="sweep"></div>
        <div class="observer">
          <div class="fov-cone"></div>
          <div class="human-icon">🧍</div>
        </div>
        <div class="compass-ring" id="compassRing">
          <!-- Full Past Trail + Forward Route Vectors SVG -->
          <svg class="route-svg" id="routeVectors" viewBox="0 0 100 100"></svg>
          <div class="range-ring r-1"></div>
          <div class="range-ring r-2"></div>
          <span class="ring-label rl-1">45km</span>
          <span class="ring-label rl-2">95km</span>
          <span class="ring-label rl-3">140km</span>
          <span class="dir d-n">N</span>
          <span class="dir d-e">E</span>
          <span class="dir d-s">S</span>
          <span class="dir d-w">W</span>
          <div id="radarTargets"></div>
        </div>
      </div>

      <div class="radar-legend">
        <span>━ PAST TRAIL</span>
        <span>┄ FUTURE PATH</span>
        <span style="color:var(--cyan);">🛰️ ORBIT ARC</span>
      </div>

      <div class="lock-hud" id="lockHud">
        <div class="lock-hud-top">
          <span id="lockTitle">🎯 LOCKED: NONE</span>
          <button class="unlock-btn" id="unlockBtn">✕ UNLOCK</button>
        </div>
        <div class="lock-hud-grid">
          <div><div class="lbl">DISTANCE</div><div id="lockDist">--</div></div>
          <div><div class="lbl">TILT / ELEV</div><div id="lockElev">--</div></div>
          <div><div class="lbl">ETA / STATUS</div><div id="lockEta">--</div></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="scan-btn" id="scanBtn">▶ SCAN 140 KM SECTOR</button>
      <button class="mode-btn" id="autoBtn">AUTO: OFF</button>
    </div>

    <div class="status" id="status">TAP ANYWHERE TO ENGAGE CONTINUOUS INTERSTELLAR SYNTH & HEAVY MATRIX.</div>
    <div id="results"></div>
  </div>

  <script>
    /* ================= 1. HEAVY MATRIX CODE + 3D STARFIELD ================= */
    const canvas = document.getElementById("spaceMatrixCanvas");
    const ctx = canvas.getContext("2d");
    const matrixChars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ∑∏∆Ω";
    let W, H, cols, drops, speeds;
    let stars3D = [];
    let isDayMode = false;
    let cameraYawOffset = 0;
    let cameraPitchOffset = 0;

    function initCanvasScene() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;

      // Dense 11px columns for heavy Matrix code rain
      cols = Math.floor(W / 11);
      drops = Array.from({ length: cols }, () => Math.floor(Math.random() * (H / 12)));
      speeds = Array.from({ length: cols }, () => 0.65 + Math.random() * 0.9);

      stars3D = Array.from({ length: 180 }, () => ({
        x: (Math.random() - 0.5) * W * 2.2,
        y: (Math.random() - 0.5) * H * 2.2,
        z: Math.random() * W,
        pz: W
      }));
    }
    window.addEventListener("resize", initCanvasScene);
    initCanvasScene();

    function draw3DSpaceAndMatrix() {
      // Gentle persistence for long, glowing Matrix trails
      ctx.fillStyle = isDayMode ? "rgba(3, 17, 26, 0.09)" : "rgba(0, 3, 1, 0.09)";
      ctx.fillRect(0, 0, W, H);

      // 3D Starfield Tunnel
      const cx = W / 2 + cameraYawOffset;
      const cy = H / 2 + cameraPitchOffset;
      for (let s of stars3D) {
        s.pz = s.z;
        s.z -= 1.6;
        if (s.z <= 1) {
          s.x = (Math.random() - 0.5) * W * 2.2;
          s.y = (Math.random() - 0.5) * H * 2.2;
          s.z = W;
          s.pz = W;
        }
        const sx = cx + (s.x / s.z) * (W * 0.5);
        const sy = cy + (s.y / s.z) * (H * 0.5);
        const px = cx + (s.x / s.pz) * (W * 0.5);
        const py = cy + (s.y / s.pz) * (H * 0.5);

        const depthRatio = 1 - s.z / W;
        ctx.strokeStyle = isDayMode
          ? `rgba(186, 230, 253, ${depthRatio * 0.5})`
          : `rgba(212, 255, 224, ${depthRatio * 0.5})`;
        ctx.lineWidth = Math.max(0.5, depthRatio * 1.8);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(sx, sy);
        ctx.stroke();
      }

      // Heavy Matrix Code Rain (renders every frame with bright white-green head glyph)
      ctx.font = "bold 12px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        const x = i * 11;
        const y = Math.floor(drops[i]) * 12;

        // Bright glowing lead glyph
        ctx.fillStyle = isDayMode ? "rgba(224, 242, 254, 0.9)" : "rgba(212, 255, 224, 0.9)";
        ctx.fillText(text, x, y);

        // Rich neon trail behind lead glyph
        const trailChar = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        ctx.fillStyle = isDayMode ? "rgba(56, 189, 248, 0.65)" : "rgba(0, 255, 65, 0.65)";
        ctx.fillText(trailChar, x, y - 12);

        drops[i] += speeds[i];
        if (y > H && Math.random() > 0.96) {
          drops[i] = 0;
        }
      }

      requestAnimationFrame(draw3DSpaceAndMatrix);
    }
    requestAnimationFrame(draw3DSpaceAndMatrix);

    /* ================= 2. BOOSTED INTERSTELLAR AMBIENT + DISTINCT EVENT SFX ================= */
    let audioCtx = null;
    let ambientStarted = false;
    let masterGain = null;
    let compressor = null;
    let soundEnabled = true;
    const soundToggle = document.getElementById("soundToggle");

    const spaceChords = [
      [55.00, 110.00, 164.81, 220.00, 329.63], // Am9
      [43.65, 87.31,  164.81, 220.00, 261.63], // Fmaj7
      [65.41, 130.81, 164.81, 196.00, 293.66], // Cadd9
      [49.00, 98.00,  146.83, 196.00, 246.94]  // G6
    ];
    let chordIndex = 0;
    let chordOscillators = [];

    function startBoostedSpaceAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (ambientStarted) return;

      ambientStarted = true;

      // Dynamics compressor maximizes phone speaker loudness without clipping
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-18, audioCtx.currentTime);
      compressor.knee.setValueAtTime(12, audioCtx.currentTime);
      compressor.ratio.setValueAtTime(4, audioCtx.currentTime);
      compressor.attack.setValueAtTime(0.01, audioCtx.currentTime);
      compressor.release.setValueAtTime(0.25, audioCtx.currentTime);
      compressor.connect(audioCtx.destination);

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      if (soundEnabled) {
        masterGain.gain.exponentialRampToValueAtTime(0.68, audioCtx.currentTime + 1.8);
      }
      masterGain.connect(compressor);

      // Warm 460Hz lowpass lets phone speakers project rich organ warmth clearly
      const padFilter = audioCtx.createBiquadFilter();
      padFilter.type = "lowpass";
      padFilter.frequency.setValueAtTime(460, audioCtx.currentTime);
      padFilter.Q.setValueAtTime(1.1, audioCtx.currentTime);

      const filterLfo = audioCtx.createOscillator();
      const filterLfoGain = audioCtx.createGain();
      filterLfo.frequency.setValueAtTime(0.1, audioCtx.currentTime);
      filterLfoGain.gain.setValueAtTime(160, audioCtx.currentTime);
      filterLfo.connect(filterLfoGain);
      filterLfoGain.connect(padFilter.frequency);
      filterLfo.start();
      padFilter.connect(masterGain);

      spaceChords[0].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const voiceGain = audioCtx.createGain();
        osc.type = idx < 2 ? "sine" : "triangle";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        voiceGain.gain.setValueAtTime(idx === 0 ? 0.42 : (idx === 1 ? 0.28 : 0.14), audioCtx.currentTime);
        osc.connect(voiceGain);
        voiceGain.connect(padFilter);
        osc.start();
        chordOscillators.push(osc);
      });

      setInterval(() => {
        if (!audioCtx || !soundEnabled) return;
        chordIndex = (chordIndex + 1) % spaceChords.length;
        const nextChord = spaceChords[chordIndex];
        const now = audioCtx.currentTime;
        chordOscillators.forEach((osc, i) => {
          osc.frequency.setTargetAtTime(nextChord[i], now, 1.2);
        });
      }, 6500);

      // Solar Wind layer
      const bufferSize = audioCtx.sampleRate * 3;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
        b6 = white * 0.115926;
      }
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = "bandpass";
      windFilter.frequency.setValueAtTime(380, audioCtx.currentTime);
      windFilter.Q.setValueAtTime(1.4, audioCtx.currentTime);

      const windGain = audioCtx.createGain();
      windGain.gain.setValueAtTime(0.22, audioCtx.currentTime);

      whiteNoise.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      whiteNoise.start();
    }

    // Distinct Sound 1: Radar Scan Sonar Wave

      if (!soundEnabled) return;

      const osc = audioCtx.createOscillator();

      osc.frequency.setValueAtTime(220, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.18, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
      osc.connect(gain);
      gain.connect(compressor || audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.7);
    }

    /* ================= 4. ANDROID COMPASS + 3D CAMERA PARALLAX ================= */
    const compassRing = document.getElementById("compassRing");

    let currentHeading = 0;

    function toCompass(deg) {
      const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
    }

    function updateCameraParallax(e) {
      if (typeof e.beta === "number") {
        const clampedBeta = Math.max(-30, Math.min(30, e.beta - 45));
        cameraPitchOffset = -clampedBeta * 2.2;
      }
    }

    function updateRadarHeading(deg, label) {
      currentHeading = Math.round(((deg % 360) + 360) % 360);
      const delta = ((currentHeading - lastHeading + 540) % 360) - 180;
      cameraYawOffset = Math.max(-140, Math.min(140, cameraYawOffset - delta * 1.8));
      lastHeading = currentHeading;

      hdgVal.textContent = `${String(currentHeading).padStart(3, "0")}° ${toCompass(currentHeading)}`;
      compassRing.style.transform = `rotate(${-currentHeading}deg)`;
      if (label) sensorTag.textContent = label;

      document.querySelectorAll(".target-tag").forEach(tag => {
        tag.style.transform = `rotate(${currentHeading}deg)`;
      });

      document.querySelectorAll(".card[data-az]").forEach(card => {
        const id = card.dataset.id;
        const targetAz = Number(card.dataset.az);
        const diff = ((targetAz - currentHeading + 540) % 360) - 180;
        const alignEl = card.querySelector(".align-text");

        if (Math.abs(diff) <= 14) {
          card.classList.add("aligned");
          alignEl.textContent = "🎯 ALIGNED — LOOK UP AT SKY!";
          if (!alignedChimedIds.has(id)) {
            alignedChimedIds.add(id);
            playAlignHarmonicSfx();
          }
        } else {
          card.classList.remove("aligned");
          alignedChimedIds.delete(id);
          alignEl.textContent = diff > 0 ? `↪ TURN RIGHT ${Math.abs(diff)}°` : `↩ TURN LEFT ${Math.abs(diff)}°`;
        }
      });
    }

    function initCompass() {
      if (compassStarted) return;
      compassStarted = true;
      let absActive = false;

      window.addEventListener("deviceorientationabsolute", (e) => {
        updateCameraParallax(e);
        if (e.alpha !== null) {
          absActive = true;
          updateRadarHeading(360 - e.alpha, "MAG-NORTH");
        }
      }, true);

      const handleStd = (e) => {
        updateCameraParallax(e);
        if (absActive) return;
        if (typeof e.webkitCompassHeading === "number") {
          updateRadarHeading(e.webkitCompassHeading, "IOS-NORTH");
        } else if (e.alpha !== null) {
          updateRadarHeading(360 - e.alpha, "GYRO");
        }
      };

      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(res => {
          if (res === "granted") window.addEventListener("deviceorientation", handleStd, true);
        }).catch(() => {});
      } else {
        window.addEventListener("deviceorientation", handleStd, true);
      }

    function getObjectSvg(kind, heading, color) {
      if (kind === "sat") {
        return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2">
          <rect x="9" y="9" width="6" height="6" fill="${color}" fill-opacity="0.35"/>
          <rect x="2" y="10" width="5" height="4"/>
          <rect x="17" y="10" width="5" height="4"/>
          <line x1="12" y1="15" x2="12" y2="20"/>
        </svg>`;
      }
      const rot = heading || 0;
      const scale = kind === "cargo" ? 1.15 : 1.0;
      return `<svg width="20" height="20" viewBox="0 0 24 24" style="transform:rotate(${rot}deg) scale(${scale});" fill="${color}">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>`;
    }

    function getBearingDistElev(lat1, lon1, lat2, lon2, altMeters) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      const distKm = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      const brng = ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
      const elevDeg = distKm > 0.1 ? Math.max(1, Math.round(Math.atan2(altMeters / 1000, distKm) * 180 / Math.PI)) : 90;
      return { dist: distKm, brng: Math.round(brng), elevDeg };
    }

    // Project a point on radar SVG (0-100 coordinate space) from azimuth & radar radius %
    function polarToSvg(azDeg, distPct) {
      const rad = (azDeg - 90) * (Math.PI / 180);
      return {
        x: 50 + Math.cos(rad) * distPct,
        y: 50 + Math.sin(rad) * distPct
      };
    }

    async function lookupFlightRoute(callsign) {
      const clean = (callsign || "").trim().toUpperCase();
      if (!clean || clean === "UNKNOWN") return "LOCAL / UNLISTED";
      if (routeCache[clean]) return routeCache[clean];
      try {
        const res = await fetch(`https://hexdb.io/api/v1/route/icao/${clean}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.route) {
            routeCache[clean] = data.route.replace("-", " ➔ ");
            return routeCache[clean];
          }
        }
      } catch (e) {}
      routeCache[clean] = "EN ROUTE (LIVE ADS-B)";
      return routeCache[clean];
    }

    function analyzeApproach(distKm, speedKmh, trackDeg, brngFromUser) {
      const now = new Date();
      const fmt = (d) => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (!speedKmh || speedKmh < 60) return { status: `ACTIVE ${fmt(now)}`, shortEta: "ACTIVE", isIncoming: false };

      const bearingToUser = (brngFromUser + 180) % 360;
      const angleDiff = Math.abs(((trackDeg - bearingToUser + 540) % 360) - 180);
      const mins = Math.max(1, Math.round((distKm / speedKmh) * 60));

      if (distKm <= 12) return { status: `🔥 OVERHEAD NOW (${fmt(now)})`, shortEta: "OVERHEAD", isIncoming: true };
      if (angleDiff <= 65) {
        const eta = new Date(now.getTime() + mins * 60000);
        return { status: `⏳ INCOMING ~${mins}m (ETA ${fmt(eta)})`, shortEta: `IN ~${mins} MIN`, isIncoming: true };
      }
      const passed = new Date(now.getTime() - mins * 60000);
      return { status: `↗ RECEDING (~${mins}m AGO • ${fmt(passed)})`, shortEta: `PASSED ${mins}m`, isIncoming: false };
    }

    async function fetchPlanes(lat, lon) {
      const radiusNm = 75;
      const url = `${PROXY_URL}/?type=planes&lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&radius=${radiusNm}`;
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      const raw = (data.ac || []).filter(p => p.lat && p.lon && p.alt_baro !== "ground");

      const enriched = await Promise.all(raw.map(async p => {
        const altFt = typeof p.alt_baro === "number" ? p.alt_baro : 0;
        const { dist, brng, elevDeg } = getBearingDistElev(lat, lon, p.lat, p.lon, altFt * 0.3048);
        const callsign = (p.flight || p.r || "UNKNOWN").trim();
        const routeStr = await lookupFlightRoute(callsign);
        const speedKmh = Math.round((p.gs || 0) * 1.852);
        const track = Math.round(p.track || 0);
        const approach = analyzeApproach(dist, speedKmh, track, brng);
        const isCargo = ["FDX", "UPS", "CLX", "GTI", "DHL", "BOX", "ATN"].some(c => callsign.startsWith(c));
        const vRate = p.baro_rate ? (p.baro_rate > 250 ? `↗ +${p.baro_rate} fpm` : (p.baro_rate < -250 ? `↘ ${p.baro_rate} fpm` : "→ LEVEL")) : "→ CRUISE";

        // Compute past wake trail & future route vector in SVG coordinates
        const distPct = Math.min(46, (dist / 140) * 46);
        const pos = polarToSvg(brng, distPct);
        const trackRad = (track - 90) * (Math.PI / 180);
        const vecLen = Math.min(28, Math.max(10, (speedKmh / 900) * 22));
        const pastPt = {
          x: pos.x - Math.cos(trackRad) * (vecLen * 0.75),
          y: pos.y - Math.sin(trackRad) * (vecLen * 0.75)
        };
        const futurePt = {
          x: pos.x + Math.cos(trackRad) * vecLen,
          y: pos.y + Math.sin(trackRad) * vecLen
        };

        return {
          id: p.hex || callsign,
          kind: isCargo ? "cargo" : "jet",
          typeLabel: isCargo ? "📦 CARGO AIRCRAFT" : "✈️ COMMERCIAL JET",
          color: isCargo ? "#ffb000" : "#00ff41",
          shortLabel: callsign,
          name: `${callsign}${p.t ? ` [${p.t}]` : ""}`,
          route: routeStr,
          squawk: p.squawk ? `SQK ${p.squawk}` : "ADS-B",
          timeStatus: approach.status,
          shortEta: approach.shortEta,
          isIncoming: approach.isIncoming,
          az: brng,
          track,
          elevText: `${elevDeg}° UP`,
          radarDistPct: distPct,
          pos,
          pastPt,
          futurePt,
          look: `${toCompass(brng)} (${brng}°) • ${elevDeg}° HIGH`,
          distOnly: `${dist.toFixed(1)} KM`,
          distText: `${dist.toFixed(1)} KM (${vRate})`,
          headingText: `${toCompass(track)} (${track}°)`,
          speedAlt: `${speedKmh} KM/H • ${altFt.toLocaleString()} FT`,
          sortKey: approach.isIncoming ? dist * 0.5 : dist
        };
      }));
      return enriched.sort((a, b) => a.sortKey - b.sortKey);
    }

    async function fetchSatellites(lat, lon) {
      if (isDayMode) return [];
      const res = await fetch(`${PROXY_URL}/?type=sats`);
      if (!res.ok) return [];
      const txt = await res.text();
      const lines = txt.replace(/\r/g, "").trim().split("\n").map(l => l.trim()).filter(Boolean);
      const now = new Date();
      const past = new Date(now.getTime() - 90000);   // -1.5 min past orbital wake
      const future = new Date(now.getTime() + 120000); // +2 min future orbital arc
      const gmstNow = satellite.gstime(now);
      const gmstPast = satellite.gstime(past);
      const gmstFuture = satellite.gstime(future);
      const observerGd = { longitude: satellite.degreesToRadians(lon), latitude: satellite.degreesToRadians(lat), height: 0.1 };
      const sats = [];

      for (let i = 0; i < lines.length - 2; i += 3) {
        const satrec = satellite.twoline2satrec(lines[i+1], lines[i+2]);
        const pNow = satellite.propagate(satrec, now);
        const pPast = satellite.propagate(satrec, past);
        const pFuture = satellite.propagate(satrec, future);
        if (!pNow.position || !pPast.position || !pFuture.position) continue;

        const lookNow = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(pNow.position, gmstNow));
        const elevDeg = satellite.radiansToDegrees(lookNow.elevation);

        if (elevDeg > 10) {
          const azNow = Math.round(satellite.radiansToDegrees(lookNow.azimuth));
          const distPctNow = Math.max(8, ((90 - elevDeg) / 80) * 46);
          const pos = polarToSvg(azNow, distPctNow);

          const lookPast = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(pPast.position, gmstPast));
          const azPast = Math.round(satellite.radiansToDegrees(lookPast.azimuth));
          const elevPast = Math.max(5, satellite.radiansToDegrees(lookPast.elevation));
          const pastPt = polarToSvg(azPast, Math.min(46, Math.max(8, ((90 - elevPast) / 80) * 46)));

          const lookFuture = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(pFuture.position, gmstFuture));
          const azFuture = Math.round(satellite.radiansToDegrees(lookFuture.azimuth));
          const elevFuture = Math.max(5, satellite.radiansToDegrees(lookFuture.elevation));
          const futurePt = polarToSvg(azFuture, Math.min(46, Math.max(8, ((90 - elevFuture) / 80) * 46)));

          const rangeKm = Math.round(lookNow.rangeSat);

          sats.push({
            id: lines[i],
            kind: "sat",
            typeLabel: "🛰️ ORBITAL SATELLITE",
            color: "#00f0ff",
            shortLabel: lines[i].slice(0, 10),
            name: lines[i],
            route: `ORBIT ARC: ${toCompass(azPast)} ➔ ${toCompass(azFuture)}`,
            squawk: "NORAD TLE",
            timeStatus: `VISIBLE ARC (${Math.round(elevDeg)}° ELEV)`,
            shortEta: `${Math.round(elevDeg)}° ARC`,
            isIncoming: true,
            az: azNow,
            track: azFuture,
            elevText: `${Math.round(elevDeg)}° UP`,
            radarDistPct: distPctNow,
            pos,
            pastPt,
            futurePt,
            look: `${toCompass(azNow)} (${azNow}°) • ${Math.round(elevDeg)}° HIGH`,
            distOnly: `${rangeKm} KM`,
            distText: `${rangeKm} KM SLANT`,
            headingText: `AZ ${azPast}° ➔ ${azFuture}°`,
            speedAlt: `27,500 KM/H • LEO ORBIT`,
            sortKey: 90 - elevDeg
          });
        }
      }
      return sats.sort((a, b) => a.sortKey - b.sortKey).slice(0, 12);
    }

    function runScan() {
      startBoostedSpaceAudio();
      playScanPulseSfx();
      initCompass();
      statusEl.textContent = "SCANNING 140 KM APPROACH SECTOR & ORBITS...";
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        const [planes, sats] = await Promise.all([fetchPlanes(lat, lon), fetchSatellites(lat, lon)]);
        allDetectedItems = [...planes, ...sats];

        statusEl.textContent = `ACTIVE SECTOR: ${planes.length} AIRCRAFT // ${sats.length} SATELLITES`;
        renderAllUI();
      }, err => {
        statusEl.textContent = "GPS ERROR: " + err.message;
      }, { enableHighAccuracy: true });
    }

    document.getElementById("scanBtn").addEventListener("click", runScan);

    let autoTimer = null;
    const autoBtn = document.getElementById("autoBtn");
    autoBtn.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoBtn.textContent = "AUTO: OFF";
      } else {
        runScan();
        autoTimer = setInterval(runScan, 15000);
        autoBtn.textContent = "AUTO: 15S";
      }
    });
  </script>
</body>
</html>
