<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SKYWATCH // 3D INTERSTELLAR MATRIX</title>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <style>
    :root {
      --bg: #000301;
      --panel: rgba(2, 16, 6, 0.84);
      --green: #00ff41;
      --green-bright: #d4ffe0;
      --green-dim: rgba(0, 255, 65, 0.2);
      --green-dark: #00330c;
      --amber: #ffb000;
      --cyan: #00f0ff;
      --red: #ff3b30;
      --font: "Courier New", Courier, monospace;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
    }
    body.day-mode {
      --bg: #03111a;
      --panel: rgba(5, 25, 38, 0.88);
      --green: #38bdf8;
      --green-bright: #e0f2fe;
      --green-dim: rgba(56, 189, 248, 0.24);
      --green-dark: #0c4a6e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--green);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
      perspective: 1100px;
      transition: background 0.5s ease, color 0.5s ease;
    }
    #matrixCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.22) 4px
      );
      z-index: 0;
      pointer-events: none;
    }
    .app {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 12px 72px;
      transform-style: preserve-3d;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--green-dim);
      padding-bottom: 10px;
      margin-bottom: 12px;
      gap: 6px;
    }
    h1 {
      margin: 0;
      font-size: 1.06rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 12px var(--green);
    }
    .sub { font-size: 0.64rem; opacity: 0.85; margin-top: 2px; }
    .hdr-btns { display: flex; gap: 6px; }
    .mode-btn {
      background: var(--panel);
      color: var(--green);
      border: 1px solid var(--green);
      padding: 6px 8px;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 0.68rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px var(--green-dim);
    }

    /* 3D Floating Tactical Radar Console */
    .radar-box {
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--green);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.85), 0 0 28px var(--green-dim), inset 0 0 24px var(--green-dim);
      transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateZ(12px);
      transform-style: preserve-3d;
      transition: transform 0.14s ease-out;
    }
    .radar-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--green-dim);
      padding-bottom: 6px;
    }
    .scope-container {
      width: 268px;
      height: 268px;
      margin: 6px auto;
      position: relative;
      border-radius: 50%;
      border: 2px solid var(--green);
      background: radial-gradient(circle, var(--green-dim) 0%, #000000 78%);
      overflow: hidden;
      box-shadow: 0 0 28px var(--green-dim), inset 0 0 22px rgba(0, 255, 65, 0.18);
      transform: translateZ(18px);
    }
    .compass-ring {
      position: absolute;
      inset: 0;
      transition: transform 0.1s linear;
    }
    .compass-ring::before, .compass-ring::after {
      content: "";
      position: absolute;
      background: var(--green-dim);
    }
    .compass-ring::before { top: 0; bottom: 0; left: 50%; width: 1px; }
    .compass-ring::after { left: 0; right: 0; top: 50%; height: 1px; }

    .range-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed var(--green-dim);
      pointer-events: none;
    }
    .r-1 { inset: 33.3%; }
    .r-2 { inset: 16.6%; }
    .ring-label {
      position: absolute;
      font-size: 0.56rem;
      opacity: 0.7;
      left: 51%;
      transform: translateY(-100%);
      pointer-events: none;
    }
    .rl-1 { top: 33.3%; }
    .rl-2 { top: 16.6%; }
    .rl-3 { top: 5%; }

    .dir {
      position: absolute;
      font-size: 0.74rem;
      font-weight: bold;
      z-index: 3;
    }
    .d-n { top: 4px; left: 50%; transform: translateX(-50%); color: var(--red); text-shadow: 0 0 8px var(--red); }
    .d-s { bottom: 4px; left: 50%; transform: translateX(-50%); }
    .d-e { right: 6px; top: 50%; transform: translateY(-50%); }
    .d-w { left: 6px; top: 50%; transform: translateY(-50%); }

    .sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0, 255, 65, 0.34) 0deg, transparent 65deg);
      animation: radarSpin 4s linear infinite;
      pointer-events: none;
    }
    @keyframes radarSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .observer {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .fov-cone {
      position: absolute;
      bottom: 50%;
      width: 64px;
      height: 134px;
      background: linear-gradient(to top, rgba(0, 255, 65, 0.3), transparent);
      clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
    }
    .human-icon {
      width: 24px; height: 24px;
      background: #000;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      box-shadow: 0 0 12px var(--green);
    }

    .radar-target {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 7;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px;
    }
    .target-tag {
      font-size: 0.55rem;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 1px 3px;
      border-radius: 3px;
      margin-top: 1px;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .radar-target.selected .target-tag {
      border-color: var(--red);
      color: #fff;
      background: rgba(255, 59, 48, 0.35);
    }
    .reticle {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 1.5px dashed var(--red);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: spinReticle 3s linear infinite;
      pointer-events: none;
    }
    @keyframes spinReticle { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

    .radar-legend {
      display: flex;
      justify-content: space-around;
      font-size: 0.64rem;
      opacity: 0.85;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--green-dim);
    }
    .lock-hud {
      margin-top: 10px;
      background: rgba(255, 59, 48, 0.12);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 9px 10px;
      display: none;
    }
    .lock-hud.active { display: block; }
    .lock-hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-weight: bold;
      color: #ff6b6b;
      margin-bottom: 4px;
    }
    .unlock-btn {
      background: transparent;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      font-family: var(--font);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .lock-hud-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      font-size: 0.72rem;
      color: var(--green-bright);
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .scan-btn {
      flex: 1;
      background: var(--green-dark);
      color: var(--green-bright);
      border: 1px solid var(--green);
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 0 16px var(--green-dim);
    }
    .scan-btn:active { transform: scale(0.98); }

    .status {
      text-align: center;
      font-size: 0.73rem;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    /* 3D Floating Telemetry Cards */
    .card {
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--green-dim);
      border-left: 4px solid var(--green);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.75);
      transform: rotateX(calc(var(--tilt-x) * 0.6)) rotateY(calc(var(--tilt-y) * 0.6)) translateZ(6px);
      transition: transform 0.16s ease-out, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card.locked-card {
      border-color: var(--red);
      border-left-width: 5px;
      box-shadow: 0 0 22px rgba(255, 59, 48, 0.28);
    }
    .card.aligned {
      border-color: var(--green-bright);
      background: rgba(0, 52, 14, 0.92);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      margin-bottom: 6px;
      font-weight: bold;
      gap: 6px;
    }
    .lock-action-btn {
      background: var(--green-dark);
      color: var(--green-bright);
      border: 1px solid var(--green);
      border-radius: 5px;
      padding: 4px 8px;
      font-family: var(--font);
      font-size: 0.68rem;
      font-weight: bold;
      cursor: pointer;
    }
    .lock-action-btn.is-locked {
      background: rgba(255, 59, 48, 0.25);
      border-color: var(--red);
      color: #ff8a80;
    }
    .route-banner {
      background: rgba(0, 255, 65, 0.09);
      border: 1px dashed var(--green-dim);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .title { font-size: 1.02rem; font-weight: bold; margin-bottom: 6px; color: var(--green-bright); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.74rem;
      border-top: 1px solid var(--green-dim);
      padding-top: 8px;
    }
    .lbl { opacity: 0.65; font-size: 0.62rem; text-transform: uppercase; }
    .val { font-weight: bold; margin-top: 2px; }
    .align-footer {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dotted var(--green-dim);
      font-size: 0.74rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>
  <div class="scanlines"></div>

  <div class="app">
    <header>
      <div>
        <h1>[SKYWATCH_3D // MATRIX]</h1>
        <div class="sub" id="modeLabel">140 KM APPROACH RADAR • NIGHT</div>
      </div>
      <div class="hdr-btns">
        <button class="mode-btn" id="soundToggle">🌌 AMBIENT: ON</button>
        <button class="mode-btn" id="modeToggle">☀️ DAY</button>
      </div>
    </header>

    <div class="radar-box">
      <div class="radar-header">
        <span>HDG: <strong id="hdgVal">000° N</strong></span>
        <span>RANGE: <strong>140 KM</strong></span>
        <span id="sensorTag">COMPASS: STANDBY</span>
      </div>

      <div class="scope-container">
        <div class="sweep"></div>
        <div class="observer">
          <div class="fov-cone"></div>
          <div class="human-icon">🧍</div>
        </div>
        <div class="compass-ring" id="compassRing">
          <div class="range-ring r-1"></div>
          <div class="range-ring r-2"></div>
          <span class="ring-label rl-1">45km</span>
          <span class="ring-label rl-2">95km</span>
          <span class="ring-label rl-3">140km</span>
          <span class="dir d-n">N</span>
          <span class="dir d-e">E</span>
          <span class="dir d-s">S</span>
          <span class="dir d-w">W</span>
          <div id="radarTargets"></div>
        </div>
      </div>

      <div class="radar-legend">
        <span>✈️ JET</span>
        <span style="color:var(--amber);">📦 CARGO</span>
        <span style="color:var(--cyan);">🛰️ SATELLITE</span>
        <span>TAP ICON TO LOCK</span>
      </div>

      <div class="lock-hud" id="lockHud">
        <div class="lock-hud-top">
          <span id="lockTitle">🎯 LOCKED: NONE</span>
          <button class="unlock-btn" id="unlockBtn">✕ UNLOCK</button>
        </div>
        <div class="lock-hud-grid">
          <div><div class="lbl">DISTANCE</div><div id="lockDist">--</div></div>
          <div><div class="lbl">TILT / ELEV</div><div id="lockElev">--</div></div>
          <div><div class="lbl">ETA / STATUS</div><div id="lockEta">--</div></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="scan-btn" id="scanBtn">▶ SCAN 140 KM SECTOR</button>
      <button class="mode-btn" id="autoBtn">AUTO: OFF</button>
    </div>

    <div class="status" id="status">TAP ANYWHERE OR SCAN TO ENGAGE WARM SPACE AMBIENCE & 3D RADAR.</div>
    <div id="results"></div>
  </div>

  <script>
    /* ================= 1. 3-LAYER 3D PARALLAX MATRIX ENGINE ================= */
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");
    const glyphs = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ∑∏∆Ω";
    let layers = [];
    let isDayMode = false;
    let motionBoost = 0;
    let compassParallaxX = 0;

    function initVisuals() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const configs = [
        { count: Math.floor(canvas.width / 22), size: 9, speed: 0.7, alpha: 0.22, depth: 0.3 },
        { count: Math.floor(canvas.width / 18), size: 12, speed: 1.5, alpha: 0.48, depth: 0.7 },
        { count: Math.floor(canvas.width / 28), size: 16, speed: 2.6, alpha: 0.85, depth: 1.3 }
      ];
      layers = configs.map(cfg => ({
        ...cfg,
        drops: Array.from({ length: cfg.count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          sp: cfg.speed * (0.8 + Math.random() * 0.5)
        }))
      }));
    }
    window.addEventListener("resize", initVisuals);
    initVisuals();

    function renderFrame() {
      ctx.fillStyle = isDayMode ? "rgba(3, 17, 26, 0.18)" : "rgba(0, 3, 1, 0.18)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      motionBoost *= 0.92; // Smooth decay when device stops moving

      for (let layer of layers) {
        ctx.font = `bold ${layer.size}px monospace`;
        for (let d of layer.drops) {
          const drawX = ((d.x + compassParallaxX * layer.depth) % canvas.width + canvas.width) % canvas.width;
          const char = glyphs[Math.floor(Math.random() * glyphs.length)];

          // Bright white-green head glyph
          ctx.fillStyle = isDayMode
            ? `rgba(224, 242, 254, ${layer.alpha})`
            : `rgba(212, 255, 224, ${layer.alpha})`;
          ctx.fillText(char, drawX, d.y);

          // Trailing glyph
          const trail = glyphs[Math.floor(Math.random() * glyphs.length)];
          ctx.fillStyle = isDayMode
            ? `rgba(56, 189, 248, ${layer.alpha * 0.75})`
            : `rgba(0, 255, 65, ${layer.alpha * 0.75})`;
          ctx.fillText(trail, drawX, d.y - layer.size);

          d.y += d.sp + motionBoost * layer.depth;
          if (d.y > canvas.height + 20) {
            d.y = -10;
            d.x = Math.random() * canvas.width;
          }
        }
      }
      requestAnimationFrame(renderFrame);
    }
    requestAnimationFrame(renderFrame);

    /* ================= 2. VELVETY WARM INTERSTELLAR ORGAN PAD ================= */
    let audioCtx = null;
    let ambientStarted = false;
    let masterGain = null;
    let soundEnabled = true;
    const soundToggle = document.getElementById("soundToggle");

    function startWarmSpacePad() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (ambientStarted) return;

      ambientStarted = true;
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      if (soundEnabled) {
        masterGain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 2.5);
      }
      masterGain.connect(audioCtx.destination);

      // Ultra-warm lowpass filter (removes all harsh high frequencies)
      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(155, audioCtx.currentTime);
      filter.Q.setValueAtTime(0.7, audioCtx.currentTime);

      // Slow cinematic breathing swell (14-second cycle)
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.setValueAtTime(0.07, audioCtx.currentTime);
      lfoGain.gain.setValueAtTime(45, audioCtx.currentTime);
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);
      lfo.start();
      filter.connect(masterGain);

      // Pure sine waves in warm Interstellar A-major/minor cinema voicing
      const notes = [
        { freq: 55.00, vol: 0.45 },  // A1 deep sub
        { freq: 82.41, vol: 0.25 },  // E2 warm fifth
        { freq: 110.0, vol: 0.18 },  // A2 octave
        { freq: 164.81, vol: 0.10 }  // E3 soft shimmer
      ];

      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(n.freq, audioCtx.currentTime);
        g.gain.setValueAtTime(n.vol, audioCtx.currentTime);
        osc.connect(g);
        g.connect(filter);
        osc.start();
      });
    }

    // Auto-start warm ambience on first touch anywhere on the page
    ["pointerdown", "touchstart", "click"].forEach(evt => {
      window.addEventListener(evt, startWarmSpacePad, { once: true });
    });

    // Subtle deep underwater sonar drop (replaces harsh text-notification beeps)
    function playSubtleSonarDrop() {
      if (!soundEnabled) return;
      startWarmSpacePad();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(290, now);
      osc.frequency.exponentialRampToValueAtTime(165, now + 0.45);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.06, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.0005, now + 0.65);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.7);
    }

    soundToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? "🌌 AMBIENT: ON" : "🔇 AMBIENT: OFF";
      startWarmSpacePad();
      if (masterGain && audioCtx) {
        masterGain.gain.setTargetAtTime(soundEnabled ? 0.22 : 0.0001, audioCtx.currentTime, 0.4);
      }
    });

    /* ================= 3. DAY / NIGHT MODE SWITCH ================= */
    const modeToggle = document.getElementById("modeToggle");
    const modeLabel = document.getElementById("modeLabel");
    modeToggle.addEventListener("click", () => {
      isDayMode = !isDayMode;
      document.body.classList.toggle("day-mode", isDayMode);
      modeToggle.textContent = isDayMode ? "🌙 NIGHT" : "☀️ DAY";
      modeLabel.textContent = isDayMode ? "140 KM APPROACH RADAR • DAY" : "140 KM APPROACH RADAR • NIGHT";
      runScan();
    });

    /* ================= 4. 3D FLOATING TILT + COMPASS PARALLAX ================= */
    const compassRing = document.getElementById("compassRing");
    const hdgVal = document.getElementById("hdgVal");
    const sensorTag = document.getElementById("sensorTag");
    let currentHeading = 0;
    let lastHeading = 0;
    let compassStarted = false;
    let alignedChimedIds = new Set();

    function toCompass(deg) {
      const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
    }

    function apply3DDeviceMotion(e) {
      // Smooth 3D floating tilt from phone beta (front/back) and gamma (left/right)
      if (typeof e.beta === "number" && typeof e.gamma === "number") {
        const clampedBeta = Math.max(-25, Math.min(25, e.beta - 45));
        const clampedGamma = Math.max(-25, Math.min(25, e.gamma));
        document.documentElement.style.setProperty("--tilt-x", `${(-clampedBeta * 0.35).toFixed(1)}deg`);
        document.documentElement.style.setProperty("--tilt-y", `${(clampedGamma * 0.35).toFixed(1)}deg`);
      }
    }

    function updateRadarHeading(deg, label) {
      currentHeading = Math.round(((deg % 360) + 360) % 360);
      const delta = Math.abs(((currentHeading - lastHeading + 540) % 360) - 180);
      if (delta > 1) {
        motionBoost = Math.min(5, motionBoost + delta * 0.18);
        compassParallaxX -= ((currentHeading - lastHeading + 540) % 360 - 180) * 1.4;
      }
      lastHeading = currentHeading;

      hdgVal.textContent = `${String(currentHeading).padStart(3, "0")}° ${toCompass(currentHeading)}`;
      compassRing.style.transform = `rotate(${-currentHeading}deg)`;
      if (label) sensorTag.textContent = label;

      document.querySelectorAll(".target-tag").forEach(tag => {
        tag.style.transform = `rotate(${currentHeading}deg)`;
      });

      document.querySelectorAll(".card[data-az]").forEach(card => {
        const id = card.dataset.id;
        const targetAz = Number(card.dataset.az);
        const diff = ((targetAz - currentHeading + 540) % 360) - 180;
        const alignEl = card.querySelector(".align-text");

        if (Math.abs(diff) <= 14) {
          card.classList.add("aligned");
          alignEl.textContent = "🎯 ALIGNED — LOOK UP AT SKY!";
          if (!alignedChimedIds.has(id)) {
            alignedChimedIds.add(id);
            playSubtleSonarDrop();
          }
        } else {
          card.classList.remove("aligned");
          alignedChimedIds.delete(id);
          alignEl.textContent = diff > 0 ? `↪ TURN RIGHT ${Math.abs(diff)}°` : `↩ TURN LEFT ${Math.abs(diff)}°`;
        }
      });
    }

    function initCompass() {
      if (compassStarted) return;
      compassStarted = true;
      let absActive = false;

      window.addEventListener("deviceorientationabsolute", (e) => {
        apply3DDeviceMotion(e);
        if (e.alpha !== null) {
          absActive = true;
          updateRadarHeading(360 - e.alpha, "MAG-NORTH 3D");
        }
      }, true);

      const handleStd = (e) => {
        apply3DDeviceMotion(e);
        if (absActive) return;
        if (typeof e.webkitCompassHeading === "number") {
          updateRadarHeading(e.webkitCompassHeading, "IOS-NORTH 3D");
        } else if (e.alpha !== null) {
          updateRadarHeading(360 - e.alpha, "GYRO 3D");
        }
      };

      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(res => {
          if (res === "granted") window.addEventListener("deviceorientation", handleStd, true);
        }).catch(() => {});
      } else {
        window.addEventListener("deviceorientation", handleStd, true);
      }
    }
    initCompass();

    /* ================= 5. TARGET LOCKING, ROUTES & TELEMETRY ================= */
    const PROXY_URL = "https://skywatch-proxy.itzsahanaj-0671.workers.dev";
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const radarTargetsEl = document.getElementById("radarTargets");
    const lockHud = document.getElementById("lockHud");
    const lockTitle = document.getElementById("lockTitle");
    const lockDist = document.getElementById("lockDist");
    const lockElev = document.getElementById("lockElev");
    const lockEta = document.getElementById("lockEta");
    const routeCache = {};
    let allDetectedItems = [];
    let lockedTargetId = null;

    function selectTargetLock(id) {
      lockedTargetId = (lockedTargetId === id) ? null : id;
      playSubtleSonarDrop();
      renderAllUI();
    }

    document.getElementById("unlockBtn").addEventListener("click", () => {
      lockedTargetId = null;
      renderAllUI();
    });

    function getObjectSvg(kind, heading, color) {
      if (kind === "sat") {
        return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2">
          <rect x="9" y="9" width="6" height="6" fill="${color}" fill-opacity="0.35"/>
          <rect x="2" y="10" width="5" height="4"/>
          <rect x="17" y="10" width="5" height="4"/>
          <line x1="12" y1="15" x2="12" y2="20"/>
        </svg>`;
      }
      const rot = heading || 0;
      const scale = kind === "cargo" ? 1.15 : 1.0;
      return `<svg width="20" height="20" viewBox="0 0 24 24" style="transform:rotate(${rot}deg) scale(${scale});" fill="${color}">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>`;
    }

    function getBearingDistElev(lat1, lon1, lat2, lon2, altMeters) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      const distKm = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      const brng = ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
      const elevDeg = distKm > 0.1 ? Math.max(1, Math.round(Math.atan2(altMeters / 1000, distKm) * 180 / Math.PI)) : 90;
      return { dist: distKm, brng: Math.round(brng), elevDeg };
    }

    async function lookupFlightRoute(callsign) {
      const clean = (callsign || "").trim().toUpperCase();
      if (!clean || clean === "UNKNOWN") return "LOCAL / UNLISTED";
      if (routeCache[clean]) return routeCache[clean];
      try {
        const res = await fetch(`https://hexdb.io/api/v1/route/icao/${clean}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.route) {
            routeCache[clean] = data.route.replace("-", " ➔ ");
            return routeCache[clean];
          }
        }
      } catch (e) {}
      routeCache[clean] = "EN ROUTE (LIVE ADS-B)";
      return routeCache[clean];
    }

    function analyzeApproach(distKm, speedKmh, trackDeg, brngFromUser) {
      const now = new Date();
      const fmt = (d) => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (!speedKmh || speedKmh < 60) return { status: `ACTIVE ${fmt(now)}`, shortEta: "ACTIVE", isIncoming: false };

      const bearingToUser = (brngFromUser + 180) % 360;
      const angleDiff = Math.abs(((trackDeg - bearingToUser + 540) % 360) - 180);
      const mins = Math.max(1, Math.round((distKm / speedKmh) * 60));

      if (distKm <= 12) return { status: `🔥 OVERHEAD NOW (${fmt(now)})`, shortEta: "OVERHEAD", isIncoming: true };
      if (angleDiff <= 65) {
        const eta = new Date(now.getTime() + mins * 60000);
        return { status: `⏳ INCOMING ~${mins}m (ETA ${fmt(eta)})`, shortEta: `IN ~${mins} MIN`, isIncoming: true };
      }
      const passed = new Date(now.getTime() - mins * 60000);
      return { status: `↗ RECEDING (~${mins}m AGO • ${fmt(passed)})`, shortEta: `PASSED ${mins}m`, isIncoming: false };
    }

    async function fetchPlanes(lat, lon) {
      const radiusNm = 75;
      const url = `${PROXY_URL}/?type=planes&lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&radius=${radiusNm}`;
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      const raw = (data.ac || []).filter(p => p.lat && p.lon && p.alt_baro !== "ground");

      const enriched = await Promise.all(raw.map(async p => {
        const altFt = typeof p.alt_baro === "number" ? p.alt_baro : 0;
        const { dist, brng, elevDeg } = getBearingDistElev(lat, lon, p.lat, p.lon, altFt * 0.3048);
        const callsign = (p.flight || p.r || "UNKNOWN").trim();
        const routeStr = await lookupFlightRoute(callsign);
        const speedKmh = Math.round((p.gs || 0) * 1.852);
        const track = Math.round(p.track || 0);
        const approach = analyzeApproach(dist, speedKmh, track, brng);
        const isCargo = ["FDX", "UPS", "CLX", "GTI", "DHL", "BOX", "ATN"].some(c => callsign.startsWith(c));
        const vRate = p.baro_rate ? (p.baro_rate > 250 ? `↗ +${p.baro_rate} fpm` : (p.baro_rate < -250 ? `↘ ${p.baro_rate} fpm` : "→ LEVEL")) : "→ CRUISE";

        return {
          id: p.hex || callsign,
          kind: isCargo ? "cargo" : "jet",
          typeLabel: isCargo ? "📦 CARGO AIRCRAFT" : "✈️ COMMERCIAL JET",
          color: isCargo ? "#ffb000" : "#00ff41",
          shortLabel: callsign,
          name: `${callsign}${p.t ? ` [${p.t}]` : ""}`,
          route: routeStr,
          squawk: p.squawk ? `SQK ${p.squawk}` : "ADS-B",
          timeStatus: approach.status,
          shortEta: approach.shortEta,
          isIncoming: approach.isIncoming,
          az: brng,
          track,
          elevText: `${elevDeg}° UP`,
          radarDistPct: Math.min(46, (dist / 140) * 46),
          look: `${toCompass(brng)} (${brng}°) • ${elevDeg}° HIGH`,
          distOnly: `${dist.toFixed(1)} KM`,
          distText: `${dist.toFixed(1)} KM (${vRate})`,
          headingText: `${toCompass(track)} (${track}°)`,
          speedAlt: `${speedKmh} KM/H • ${altFt.toLocaleString()} FT`,
          sortKey: approach.isIncoming ? dist * 0.5 : dist
        };
      }));
      return enriched.sort((a, b) => a.sortKey - b.sortKey);
    }

    async function fetchSatellites(lat, lon) {
      if (isDayMode) return [];
      const res = await fetch(`${PROXY_URL}/?type=sats`);
      if (!res.ok) return [];
      const txt = await res.text();
      const lines = txt.replace(/\r/g, "").trim().split("\n").map(l => l.trim()).filter(Boolean);
      const now = new Date();
      const later = new Date(now.getTime() + 60000);
      const gmst = satellite.gstime(now);
      const gmstLater = satellite.gstime(later);
      const observerGd = { longitude: satellite.degreesToRadians(lon), latitude: satellite.degreesToRadians(lat), height: 0.1 };
      const sats = [];

      for (let i = 0; i < lines.length - 2; i += 3) {
        const satrec = satellite.twoline2satrec(lines[i+1], lines[i+2]);
        const posNow = satellite.propagate(satrec, now);
        const posNext = satellite.propagate(satrec, later);
        if (!posNow.position || !posNext.position) continue;

        const lookNow = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(posNow.position, gmst));
        const elevDeg = satellite.radiansToDegrees(lookNow.elevation);

        if (elevDeg > 10) {
          const azNow = Math.round(satellite.radiansToDegrees(lookNow.azimuth));
          const lookNext = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(posNext.position, gmstLater));
          const azNext = Math.round(satellite.radiansToDegrees(lookNext.azimuth));
          const rangeKm = Math.round(lookNow.rangeSat);

          sats.push({
            id: lines[i],
            kind: "sat",
            typeLabel: "🛰️ ORBITAL SATELLITE",
            color: "#00f0ff",
            shortLabel: lines[i].slice(0, 10),
            name: lines[i],
            route: `ORBIT ARC: ${toCompass(azNow)} ➔ ${toCompass(azNext)}`,
            squawk: "NORAD TLE",
            timeStatus: `VISIBLE ARC (${Math.round(elevDeg)}° ELEV)`,
            shortEta: `${Math.round(elevDeg)}° ARC`,
            isIncoming: true,
            az: azNow,
            track: azNext,
            elevText: `${Math.round(elevDeg)}° UP`,
            radarDistPct: Math.max(8, ((90 - elevDeg) / 80) * 46),
            look: `${toCompass(azNow)} (${azNow}°) • ${Math.round(elevDeg)}° HIGH`,
            distOnly: `${rangeKm} KM`,
            distText: `${rangeKm} KM SLANT`,
            headingText: `AZ ${azNow}° ➔ ${azNext}°`,
            speedAlt: `27,500 KM/H • LEO ORBIT`,
            sortKey: 90 - elevDeg
          });
        }
      }
      return sats.sort((a, b) => a.sortKey - b.sortKey).slice(0, 12);
    }

    function renderAllUI() {
      const lockedItem = allDetectedItems.find(i => i.id === lockedTargetId);
      if (lockedItem) {
        lockHud.classList.add("active");
        lockTitle.textContent = `🎯 LOCKED: ${lockedItem.name}`;
        lockDist.textContent = lockedItem.distOnly;
        lockElev.textContent = lockedItem.elevText;
        lockEta.textContent = lockedItem.shortEta;
      } else {
        lockHud.classList.remove("active");
      }

      radarTargetsEl.innerHTML = allDetectedItems.map(item => {
        const rad = (item.az - 90) * (Math.PI / 180);
        const x = 50 + Math.cos(rad) * item.radarDistPct;
        const y = 50 + Math.sin(rad) * item.radarDistPct;
        const isSel = item.id === lockedTargetId;
        return `
          <div class="radar-target ${isSel ? "selected" : ""}"
               onclick="selectTargetLock('${item.id}')"
               style="left:${x}%;top:${y}%;color:${item.color};">
            ${isSel ? '<div class="reticle"></div>' : ""}
            ${getObjectSvg(item.kind, item.track, isSel ? "#ff3b30" : item.color)}
            <span class="target-tag" style="transform:rotate(${currentHeading}deg)">${item.shortLabel}</span>
          </div>
        `;
      }).join("");

      resultsEl.innerHTML = allDetectedItems.length ? allDetectedItems.map(item => {
        const isSel = item.id === lockedTargetId;
        return `
          <div class="card ${isSel ? "locked-card" : ""}" data-az="${item.az}" data-id="${item.id}">
            <div class="card-top">
              <span>${item.typeLabel}</span>
              <button class="lock-action-btn ${isSel ? "is-locked" : ""}" onclick="selectTargetLock('${item.id}')">
                ${isSel ? "🎯 LOCKED" : "⊕ LOCK TARGET"}
              </button>
            </div>
            <div class="title">${item.name}</div>
            <div style="font-size:0.74rem;color:var(--amber);font-weight:bold;margin-bottom:6px;">${item.timeStatus}</div>
            <div class="route-banner">
              <span>ROUTE: ${item.route}</span>
              <span>${item.squawk}</span>
            </div>
            <div class="grid">
              <div>
                <div class="lbl">SKY POSITION</div>
                <div class="val">${item.look}</div>
              </div>
              <div>
                <div class="lbl">DISTANCE & CLIMB</div>
                <div class="val">${item.distText}</div>
              </div>
              <div>
                <div class="lbl">HEADING</div>
                <div class="val">${item.headingText}</div>
              </div>
              <div>
                <div class="lbl">SPEED & ALTITUDE</div>
                <div class="val">${item.speedAlt}</div>
              </div>
            </div>
            <div class="align-footer">
              <span class="align-text">ROTATE PHONE TO ALIGN</span>
              <span>AZIMUTH: ${item.az}°</span>
            </div>
          </div>
        `;
      }).join("") : `<div class="card" style="text-align:center;">NO MOVING TARGETS WITHIN 140 KM RIGHT NOW.</div>`;

      updateRadarHeading(currentHeading);
    }

    function runScan() {
      startWarmSpacePad();
      initCompass();
      statusEl.textContent = "SCANNING 140 KM APPROACH SECTOR & ORBITS...";
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        const [planes, sats] = await Promise.all([fetchPlanes(lat, lon), fetchSatellites(lat, lon)]);
        allDetectedItems = [...planes, ...sats];

        statusEl.textContent = `ACTIVE SECTOR: ${planes.length} AIRCRAFT // ${sats.length} SATELLITES`;
        renderAllUI();
      }, err => {
        statusEl.textContent = "GPS ERROR: " + err.message;
      }, { enableHighAccuracy: true });
    }

    document.getElementById("scanBtn").addEventListener("click", runScan);

    let autoTimer = null;
    const autoBtn = document.getElementById("autoBtn");
    autoBtn.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoBtn.textContent = "AUTO: OFF";
      } else {
        runScan();
        autoTimer = setInterval(runScan, 15000);
        autoBtn.textContent = "AUTO: 15S";
      }
    });
  </script>
</body>
